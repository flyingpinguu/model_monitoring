stages:
  download_data:
    cmd: uv run python -m src.download_data
    deps:
      - src/download_data.py
      - src/preprocess.py
    outs:
      - data/green_tripdata_2024-01.parquet

  train:
    cmd: uv run python -m src.train
    deps:
      - src/train.py
      - src/preprocess.py
      - data/green_tripdata_2024-01.parquet
      - uv.lock
    outs:
      - models/model.joblib
      - models/model_metadata.json
    metrics:
      - reports/train_metrics.json:
          cache: false
