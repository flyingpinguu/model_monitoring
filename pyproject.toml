[project]
name = "mle-mlops-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.0",
    "dvc>=3.67.1",
    "evidently>=0.7.23",
    "fastapi>=0.136.1",
    "joblib>=1.5.2",
    "matplotlib>=3.11.2",
    "mlflow==3.16.1",
    "pandas>=3.0.6",
    "prometheus-client>=0.23.1",
    "pydantic>=2.11.4",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.32.5",
    "scikit-learn>=1.9.1",
    "skops>=0.16.0",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    # MLflow records pip's version when packaging the notebook model.
    "pip>=26.0",
]

[tool.rumdl]
disable = ["MD013"]
